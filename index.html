<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steven的Scratch作品社区</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, sans-serif;
}
body{
    background:#161a23;
    color:#e8e8e8;
    min-height:100vh;
    padding:32px 16px;
}
.container{
    max-width:1280px;
    margin:0 auto;
}
header{
    margin-bottom:24px;
}
h1{
    font-size:34px;
    color:#73b8ff;
    margin-bottom:8px;
}
.desc-tip{
    color:#94a3b8;
    margin-bottom:16px;
}
.search-wrap{
    margin-bottom:24px;
}
#searchInput{
    width:100%;
    padding:12px 16px;
    font-size:16px;
    border-radius:8px;
    border:1px solid #384152;
    background:#202633;
    color:#fff;
}
#searchInput::placeholder{
    color:#718096;
}
.card-wrap{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:24px;
}
.no-result{
    grid-column:1/-1;
    text-align:center;
    color:#94a3b8;
    font-size:18px;
    padding:40px 0;
}
.card{
    background:#202633;
    border-radius:12px;
    overflow:hidden;
}
.card-img{
    width:100%;
    height:180px;
    object-fit:cover;
    background:#2c3444;
}
.card-body{
    padding:16px;
}
.card-title{
    font-size:18px;
    margin-bottom:6px;
}
.card-author{
    font-size:13px;
    color:#94a3b8;
    margin-bottom:10px;
}
.card-desc{
    font-size:14px;
    color:#cbd5e1;
    line-height:1.5;
    min-height:42px;
}
.download-btn{
    margin-top:14px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#2b78d4;
    color:white;
    cursor:pointer;
    font-size:15px;
}
.download-btn:hover{
    background:#3b88e4;
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>Steven的Scratch作品社区</h1>
        <div class="desc-tip">Scratch sb3项目下载，点击卡片按钮下载作品文件</div>
    </header>

    <div class="search-wrap">
        <input id="searchInput" placeholder="🔍 搜索作品名称、作者、简介……">
    </div>

    <div class="card-wrap" id="cardContainer"></div>
</div>
<script>
// =========在这里添加/修改你的sb3作品列表=========
// sb3File: 文件相对路径，图片previewImg：预览图路径，没有图片填""
const workList = [
    {
        title:"2D版mc26.2汉化版",
        author:"Steven",
        desc:"之前的版本：26.1（已下架）",
        previewImg:"mc1.png",
        sb3File:"mc1.sb3"
    },
    {
        title:"最新版2D版mc26.3！汉化版",
        author:"Steven",
        desc:"最新版本",
        previewImg:"mc2.png",
        sb3File:"mc2.sb3"
    },
    {
        title:"拉闸行动",
        author:"未知",
        desc:"这是一个scratch项目",
        previewImg:"拉闸行动.png",
        sb3File:"拉闸行动.sb3"
    },
    {
        title:"注意力训练",
        author:"Steven原创",
        desc:"这是Steven的第一个作品哦",
        previewImg:"专注力训练.png",
        sb3File:"专注力训练.sb3"
    },
    {
        title:"其余作品持续更新！",
        author:"网站创作者",
        desc:"这是一个提示，不要下载！",
        previewImg:"更新.png",
        sb3File:"更新.sb3"
    },
];
const container = document.getElementById("cardContainer");
const searchInput = document.getElementById("searchInput");

function escapeHtml(str){
    if(!str) return "";
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

//渲染卡片
function renderList(keyword=""){
    container.innerHTML="";
    const kw = keyword.toLowerCase().trim();
    const filterList = workList.filter(item=>{
        return item.title.toLowerCase().includes(kw)
            || item.author.toLowerCase().includes(kw)
            || item.desc.toLowerCase().includes(kw);
    });

    if(filterList.length === 0){
        container.innerHTML = `<div class="no-result">没有找到匹配的作品</div>`;
        return;
    }

    filterList.forEach(item=>{
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            ${item.previewImg ? `<img class="card-img" src="${escapeHtml(item.previewImg)}">` : `<div class="card-img"></div>`}
            <div class="card-body">
                <div class="card-title">${escapeHtml(item.title)}</div>
                <div class="card-author">作者：${escapeHtml(item.author)}</div>
                <div class="card-desc">${escapeHtml(item.desc)}</div>
                <button class="download-btn" data-file="${escapeHtml(item.sb3File)}">下载 sb3 文件</button>
            </div>
        `;
        container.appendChild(card);
    })

    //绑定下载事件
    document.querySelectorAll(".download-btn").forEach(btn=>{
        btn.onclick = function(){
            const file = this.dataset.file;
            const a = document.createElement('a');
            a.href = file;
            a.download = file;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
    })
}

//输入框实时搜索
searchInput.oninput = ()=>{
    renderList(searchInput.value);
}

//初始渲染全部
renderList();
</script>
</body>
</html>
<a href="https://icp.gov.moe/?keyword=20266605" target="_blank">萌ICP备20266605号</a>
